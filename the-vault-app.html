<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Vault · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ---------- frozen tokens (verbatim from spec/vault-tokens.css) ---------- */
:root{
  --base:#FCFCFB;--ink:#1D1D1F;--ink-2:#86868B;--ink-3:#B0B0B4;
  --fill:#F4F4F2;--fill-2:#EEEEEB;
  --hair:rgba(29,29,31,.08);--hair-strong:rgba(29,29,31,.12);--hair-soft:rgba(29,29,31,.05);
  --critical:#D9503F;--partial:#BD7D22;--success:#2E9E58;
  --pill-bg:#1D1D1F;--pill-ink:#FCFCFB;
  --sans:'Geist',sans-serif;--mono:'Geist Mono',monospace;
}
[data-theme="dark"]{
  --base:#101012;--ink:#F5F5F7;--ink-2:#98989D;--ink-3:#636368;
  --fill:#1B1B1D;--fill-2:#212124;
  --hair:rgba(245,245,247,.08);--hair-strong:rgba(245,245,247,.14);--hair-soft:rgba(245,245,247,.05);
  --critical:#E5675B;--partial:#D9A03C;--success:#41BE73;
  --pill-bg:#F5F5F7;--pill-ink:#101012;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--base);color:var(--ink);font-family:var(--sans)}
::selection{background:var(--hair-strong)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
*{scrollbar-width:thin;scrollbar-color:var(--hair-strong) transparent}
input,select,textarea{font-family:var(--sans);outline:none;color:inherit}
input::placeholder,textarea::placeholder{color:var(--ink-3)}

.app{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--base)}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--hair)}
.tb-chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--fill);font:500 12px var(--mono);color:var(--ink-2);cursor:default}
.tb-search{display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;background:var(--fill);color:var(--ink-3);width:220px;cursor:text}
.tb-icon{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;position:relative}
.tb-icon:hover{background:var(--fill)}
.badge{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:999px;background:var(--critical)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--fill);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font:500 10px var(--mono);color:var(--ink-2)}

.body{flex:1;display:flex;min-height:0}
.rail{width:216px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.rail.collapsed{width:60px}
.rail-scroll{flex:1;overflow-y:auto;padding:12px 0;min-height:0}
.rail-item{display:flex;align-items:center;gap:12px;height:38px;padding:0 18px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.rail-item:hover{color:var(--ink)}
.rail-item.active{color:var(--ink)}
.rail-item.active .rail-bar{opacity:1}
.rail-bar{position:absolute;left:0;width:2px;height:20px;background:var(--ink);border-radius:0 2px 2px 0;opacity:0}
.rail-item{position:relative}
.rail .lbl{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.rail.collapsed .lbl,.rail.collapsed .rail-head,.rail.collapsed .rs-role{display:none}
.rail-sep{height:1px;background:var(--hair);margin:10px 18px}
.rail-head{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--ink-3);padding:6px 18px 4px;text-transform:uppercase}
.rail-foot{flex:none;border-top:1px solid var(--hair);padding:12px}
.rs-label{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--ink-3);padding:0 6px 8px;text-transform:uppercase}
.rail.collapsed .rs-label{display:none}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--fill);border:1px solid var(--hair);border-radius:12px;padding:3px}
.seg button{font:500 10px var(--mono);letter-spacing:.03em;color:var(--ink-2);background:transparent;border:none;padding:6px 8px;border-radius:9px;cursor:pointer;flex:1 0 auto}
.seg button.on{background:var(--fill-2);color:var(--ink)}
.rail.collapsed .rail-foot .seg{flex-direction:column}

.main{flex:1;min-width:0;overflow:auto;position:relative}
.view{animation:vfade .15s ease}
@keyframes vfade{from{opacity:0}to{opacity:1}}
.wrap{padding:26px 40px 60px}

/* shared bits */
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:999px;background:var(--pill-bg);color:var(--pill-ink);font:500 13px var(--sans);cursor:pointer;border:none}
.pill.sm{height:34px;padding:0 16px;font-size:12.5px}
.pill.disabled{opacity:.32;cursor:not-allowed}
.qbtn{font:500 13px var(--sans);color:var(--ink-2);cursor:pointer;padding:8px 6px}
.qbtn:hover{color:var(--ink)}
.sbtn{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:var(--fill);color:var(--ink);font:500 12.5px var(--sans);cursor:pointer}
.sbtn:hover{background:var(--fill-2)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
.h1{font:600 26px/1.1 var(--sans);letter-spacing:-.02em}
.h2{font:600 15px var(--sans);letter-spacing:-.01em}
.num{font:200 44px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sub{font:400 13px var(--sans);color:var(--ink-2)}
.mono{font:400 12px var(--mono);color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--sans);padding:3px 10px;border-radius:999px}
.chip.crit{color:var(--critical);background:rgba(217,80,63,.1)}
.chip.part{color:var(--partial);background:rgba(189,125,34,.1)}
.chip.seal{color:var(--ink-2);background:var(--fill)}
.dot{width:6px;height:6px;border-radius:999px;flex:none}
.card{border:1px solid var(--hair);border-radius:16px;padding:22px 24px}
.tag{font:400 10.5px var(--mono);color:var(--ink-2);border:1px solid var(--hair-strong);padding:3px 10px;border-radius:999px;white-space:nowrap}
.trow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--hair)}
.thead{display:flex;align-items:center;gap:14px;padding:6px 4px;border-bottom:1px solid var(--hair)}
.th{font:500 10px var(--mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.amt{font:500 12.5px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.kpi-num{font:200 44px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.check{animation:cdis 0s linear 2s forwards}
@keyframes cdis{to{opacity:0}}
.skel{background:var(--fill-2);border-radius:6px}
.modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:30;display:flex;align-items:center;justify-content:center}
.modal{width:520px;background:var(--base);border:1px solid var(--hair-strong);border-radius:18px;padding:26px 28px}
.inp{width:100%;background:var(--fill);border:1px solid var(--hair-strong);border-radius:8px;color:var(--ink);font:400 13px var(--sans);padding:10px 12px}
.inp:focus{border-color:var(--ink)}
textarea.inp{resize:vertical}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:10px;cursor:pointer;outline:none}
.ddb:focus{border-color:var(--ink)}
.ddp{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--base);border:1px solid var(--hair-strong);border-radius:8px;padding:4px;z-index:40;max-height:240px;overflow-y:auto}
.ddi{display:flex;align-items:center;padding:8px 10px;border-radius:6px;font:400 13px var(--sans);color:var(--ink);cursor:pointer}
.ddi:hover,.ddi.hi{background:var(--fill)}
.ddi.sel,.ddi.sel span{font-weight:500}
.gap-shell{position:fixed;top:52px;right:0;bottom:0;width:412px;z-index:20;background:var(--base);border-left:1px solid var(--hair-strong);opacity:0;transition:opacity .15s ease}
.gap-shell.on{opacity:1}
.gap-body{position:absolute;top:0;left:0;right:0;bottom:0;padding:26px 30px;display:flex;flex-direction:column;overflow-y:auto;opacity:1;transition:opacity .15s ease}
.gap-body.fade{opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar"></div>

function reducedMotion(){ return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches); }

/* mounts/updates the gap panel inside #gap-host only — the central body's DOM is never touched.
   anim: 'in' first open (150ms fade), 'swap'/false content change (150ms crossfade), close fades out.
   Returns false when the host is not on screen (caller falls back to render()). */
function gapMount(anim){
  var host=document.getElementById('gap-host'); if(!host) return false;
  var wrapEl=document.getElementById('ck-wrap'); if(wrapEl&&wrapEl.style) wrapEl.style.paddingRight=ui.gapOpen?'452px':'40px';
  var qb=document.getElementById('ck-gapbtn'); if(qb&&qb.style) qb.style.display=ui.gapOpen?'none':'';
  var reduced=reducedMotion();
  var sh=host.querySelector?host.querySelector('.gap-shell'):null;
  if(!ui.gapOpen){
    if(!sh||reduced){ host.innerHTML=''; return true; }
    sh.classList.remove('on');
    setTimeout(function(){ if(!ui.gapOpen) host.innerHTML=''; },180);
    return true;
  }
  var inner=gapPanel(ui.gapOpen);
  if(!sh||anim==='in'){
    var vis=(reduced||anim!=='in')?' on':'';
    host.innerHTML='<div class="gap-shell'+vis+'"><div class="gap-body">'+inner+'</div></div>';
    if(!vis){ var ns=host.querySelector('.gap-shell'); if(ns){ void ns.offsetWidth; ns.classList.add('on'); } }
    return true;
  }
  if(reduced){ sh.innerHTML='<div class="gap-body">'+inner+'</div>'; var rb=sh.querySelector('.gap-body'); if(rb) rb.scrollTop=0; return true; }
  var old=sh.querySelector('.gap-body');
  sh.insertAdjacentHTML('beforeend','<div class="gap-body fade">'+inner+'</div>');
  var bodies=sh.querySelectorAll('.gap-body'), nb=bodies[bodies.length-1];
  if(nb){ void nb.offsetWidth; nb.classList.remove('fade'); nb.scrollTop=0; }
  if(old){ old.classList.add('fade'); setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },180); }
  return true;
}

  d.options().forEach(function(o,i){ list+='<div class="ddi'+(i===ui.dd.hi?' hi':'')+(o.v===val?' sel':'')+'" role="option" data-act="ddPick" data-arg="'+id+':'+i+'">'+o.html+'</div>'; });

function ddField(id){
  var d=DD_DEFS[id], val=d.get(), open=ui.dd.open===id, selHtml='';
  d.options().forEach(function(o){ if(o.v===val) selHtml=o.html; });
  return '<div class="dd"><div class="inp ddb" id="dd-'+id+'" tabindex="0" role="button" aria-haspopup="listbox" aria-expanded="'+(open?'true':'false')+'" data-act="ddToggle" data-arg="'+id+'"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+selHtml+'</span><span style="font-size:9px;color:var(--ink-3)">▾</span></div>'+(open?ddPopHtml(id):'')+'</div>';

/* open/close operate on the dropdown's own DOM only — never a pane render */
function ddSetOpen(id){
  var prev=ui.dd.open;
  if(prev){
    var pb=document.getElementById('dd-'+prev);
    if(pb){
      if(pb.setAttribute) pb.setAttribute('aria-expanded','false');
      var pp=(pb.parentNode&&pb.parentNode.querySelector)?pb.parentNode.querySelector('.ddp'):null;
      if(pp&&pp.parentNode) pp.parentNode.removeChild(pp);
    }
    ui.dd.open=null; ui.dd.focus=null;
  }
  if(id&&id!==prev){
    var d=DD_DEFS[id]; if(!d) return;
    var val=d.get(), idx=0; d.options().forEach(function(o,i){ if(o.v===val) idx=i; });
    ui.dd.open=id; ui.dd.hi=idx; ui.dd.focus=id;
    var b=document.getElementById('dd-'+id);
    if(b&&b.insertAdjacentHTML){ if(b.setAttribute) b.setAttribute('aria-expanded','true'); b.insertAdjacentHTML('afterend',ddPopHtml(id)); }
  }
}

/* ============================ KPI count-up (first cockpit render) ============================ */
function runKpiCountup(){
  if(ui.kpiDone) return; ui.kpiDone=true;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var els=document.querySelectorAll('[data-kpi]');
  els.forEach(function(el){
    var target=parseInt(el.getAttribute('data-kpi'),10);
    if(!target) return;
    var suffix=el.innerHTML.replace(/^\d+/,'');
    var start=null, dur=520;
    function step(ts){ if(!start)start=ts; var p=Math.min(1,(ts-start)/dur); el.innerHTML=Math.round(p*target)+suffix; if(p<1) requestAnimationFrame(step); }
    el.innerHTML='0'+suffix; requestAnimationFrame(step);
  });
}

/* ============================ actions ============================ */
function setTheme(v){ theme=v; try{localStorage.setItem(LS_THEME,v);}catch(e){} render(); }
function setRole(v){ role=v; try{localStorage.setItem(LS_ROLE,v);}catch(e){}
  /* reset flow states that are role-specific so a fresh role starts clean */
  ui.gapOpen=false; ui.drawer=null; ui.kpiDone=false; ui.dd.open=null; ui.dd.focus=null;
  /* the process map is legible to every role: stay on it so the highlight
     follows the switcher. Otherwise land on the role's home. */
  var dest = location.hash==='#/process' ? '#/process' : ROLES[role].landing;
  if(location.hash===dest){ render(); } else { location.hash=dest; }
}
var HANDLERS={
  nav:function(a){ nav(a); },
  role:function(a){ setRole(a); },
  theme:function(a){ setTheme(a); },
  gap:function(a){
    var p=String(a||'1.3.6').split(':'), key=p[0]+':'+(p[1]||'6');
    if(ui.gapOpen===key) return;
    var was=!!ui.gapOpen;
    ui.requestSent=false; ui.gapOpen=key;
    if(!gapMount(was?'swap':'in')) render();
  },
  gapClose:function(){ ui.gapOpen=false; if(!gapMount('out')) render(); },
  request:function(){ ui.requestSent=true; if(!ui.gapOpen||!gapMount(false)) render(); },
  drop:function(){ ui.homeStage = ui.homeStage==='owed'?'loading':(ui.homeStage==='loading'?'filed':'owed'); render(); },
  attach:function(){ if(curRoute()==='#/home/manual'){ ui.manualStage='attached'; patch('man-flow',manFlowHtml()); return; } render(); },
  manualSubmit:function(){ ui.manualStage='submitted'; patch('man-flow',manFlowHtml()); },
  validate:function(){ ui.validated=true; render(); },
  drawer:function(a){ ui.drawer=a; render(); },
  drawerClose:function(){ ui.drawer=null; render(); },
  seal:function(){ ui.sealed=true; render(); },
  resolve:function(){ ui.resolved=true; render(); },
  notify:function(){ ui.notified=true; render(); },
  profile:function(a){ ui.profile=a; render(); },
  export:function(){ ui.exported=true; render(); },
  ddToggle:function(a){ ddSetOpen(ui.dd.open===a?null:a); },
  ddPick:function(a){
    var i=String(a).indexOf(':'), id=String(a).slice(0,i), n=parseInt(String(a).slice(i+1),10);
    var d=DD_DEFS[id]; if(!d) return;
    var o=d.options()[n];
    if(o){
      d.set(o.v);
      var b=document.getElementById('dd-'+id);
      if(b&&b.querySelector){ var vs=b.querySelector('span'); if(vs) vs.innerHTML=o.html; }
    }
    ddSetOpen(null);
    if(o&&d.patches) d.patches();
  },
  unsealOpen:function(){ ui.unsealed='modal'; render(); },
  unsealCancel:function(){ ui.unsealed=false; render(); },
  unsealConfirm:function(){
    var ta=document.getElementById('unseal-reason');
    if(!ta||!ta.value.trim()){ var w=document.getElementById('unseal-warn'); if(w){ w.style.color='var(--critical)'; w.textContent='a reason is mandatory'; } if(ta) ta.focus(); return; }
    ui.unsealed='done'; render();
  },
  noop:function(){}
};
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  var a=t?t.getAttribute('data-act'):null, arg=t?t.getAttribute('data-arg'):null;
  /* click outside an open dropdown closes it (dropdown DOM only); a data-act click still runs after */
  if(ui.dd.open && a!=='ddToggle' && a!=='ddPick'){ ddSetOpen(null); }
  if(!t||!HANDLERS[a]) return;
  e.stopPropagation(); HANDLERS[a](arg);
});
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(ui.dd.open){
    var opts=DD_DEFS[ui.dd.open].options();
    if(k==='ArrowDown'||k==='ArrowUp'){
      e.preventDefault();
      ui.dd.hi=(ui.dd.hi+(k==='ArrowDown'?1:opts.length-1))%opts.length;
      var items=document.querySelectorAll('.ddi');
      for(var i=0;i<items.length;i++){ items[i].classList.toggle('hi',i===ui.dd.hi); }
      if(items[ui.dd.hi]&&items[ui.dd.hi].scrollIntoView) items[ui.dd.hi].scrollIntoView({block:'nearest'});
    } else if(k==='Enter'){ e.preventDefault(); HANDLERS.ddPick(ui.dd.open+':'+ui.dd.hi); }
    else if(k==='Escape'){ e.preventDefault(); ddSetOpen(null); }
    else if(k===' '){ e.preventDefault(); }
  } else {
    var ae=document.activeElement;
    if(ae&&ae.classList&&ae.classList.contains('ddb')&&(k==='Enter'||k===' ')){ e.preventDefault(); HANDLERS.ddToggle(ae.getAttribute('data-arg')); }
  }
});

/* ============================ boot ============================ */
window.addEventListener('hashchange',render);
if(!location.hash || ROUTE_SEC[location.hash]===undefined){ location.hash=ROLES[role].landing; }
render();

})();
